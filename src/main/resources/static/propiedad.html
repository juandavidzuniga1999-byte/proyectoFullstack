    <nav>

            <a href="https://instagram.com/" target="_blank" aria-label="Instagram"><i class="fab fa-instagram"></i></a>

        <div class="galeria-overlay">
            <div class="etiquetas" id="etiquetasPropiedad"></div>
            <div class="galeria-info">
                <h1 id="tituloPropiedad">Cargando...</h1>
                <span class="precio-badge" id="precioPropiedad"></span>
            </div>
        </div>
    </div>

    <div class="galeria-miniaturas" id="miniaturasPropiedad"></div>

    <div class="detalle-datos" id="datosPropiedad"></div>

</section>

    <div class="footer-grid">
