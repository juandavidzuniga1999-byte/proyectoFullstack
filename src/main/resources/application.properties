spring.application.name=proyecto

# ---- Puerto ----
# Railway asigna el puerto por variable de entorno PORT. Si no existe (ej. corriendo
# en tu compu local), usa 8080 por default.
server.port=${PORT:8080}

# ---- Conexion a MySQL (Railway) ----
# Estos valores NO estan quemados aqui: se leen de variables de entorno que vas a
# configurar en el dashboard de Railway (Settings > Variables del servicio de tu app).
# Los nombres MYSQLHOST, MYSQLPORT, etc. son los que Railway te da automaticamente
# cuando agregas el plugin de MySQL a tu proyecto.
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- JWT ----
# Llave secreta para firmar los tokens de login. En produccion (Railway),
# agrega esta misma variable como JWT_SERVICE_KEY en Settings > Variables
# de tu servicio de app, en vez de dejarla quemada aqui.
jwt.service.key=${JWT_SERVICE_KEY:3tbK6FNjh6cAV09+NX7x/vJGpBJQdMWL68yZlWJqGC4=}